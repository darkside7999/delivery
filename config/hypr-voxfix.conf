# voxfix — keybinds para Hyprland
#
# Añade estas líneas a tu ~/.config/hypr/hyprland.conf, o sourcéalas con:
#   source = ~/.config/hypr/voxfix.conf
#
# Nota (Omarchy): SUPER+SHIFT+D suele estar ocupado (lazydocker) y SUPER+Space es
# el lanzador. Por eso se usan CTRL y ALT. Cambia las teclas si chocan con otro bind.

bind = SUPER, D, exec, voxfix toggle        # dictar / parar
bind = SUPER CTRL, D, exec, voxfix cancel    # cancelar sin transcribir
bind = SUPER ALT, D, exec, voxfix-menu       # menú de configuración
