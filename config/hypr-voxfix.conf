# voxfix — keybind para Hyprland
#
# Añade esta línea a tu ~/.config/hypr/hyprland.conf, o sourcéala con:
#   source = ~/.config/hypr/voxfix.conf
#
# SUPER + D inicia/para el dictado (toggle). Cambia la tecla si choca con otro bind.

bind = SUPER, D, exec, voxfix toggle

# Opcional: cancelar la grabación en curso sin transcribir.
bind = SUPER SHIFT, D, exec, voxfix cancel
